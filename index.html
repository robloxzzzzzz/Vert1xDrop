  (() => {
    const canvas = document.getElementById('bg-canvas');
    if (!window.THREE) return;
    const renderer = new THREE.WebGLRenderer({canvas, alpha:true, antialias:true});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.7));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x050505, 0);
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050505, 0.035);
    const camera = new THREE.PerspectiveCamera(58, window.innerWidth/window.innerHeight, .1, 100);
    camera.position.set(0,0,16);
    scene.add(new THREE.AmbientLight(0x60a5fa,.65));
    const key = new THREE.PointLight(0x38bdf8,2.4,36); key.position.set(4,4,7); scene.add(key);
    const green = new THREE.MeshStandardMaterial({color:0x3b82f6, emissive:0x172554, emissiveIntensity:1.5, metalness:.7, roughness:.25, wireframe:true});
    const lime = new THREE.MeshStandardMaterial({color:0x60a5fa, emissive:0x38bdf8, emissiveIntensity:.7, metalness:.5, roughness:.35, wireframe:true});
    const shapes=[];
    for(let i=0;i<7;i++){
      const group=new THREE.Group();
      const geo=i%2===0?new THREE.TorusGeometry(.7+Math.random()*.6,.16,8,28):new THREE.IcosahedronGeometry(.8+Math.random()*.55,1);
      const mesh=new THREE.Mesh(geo,i%3===0?lime:green);
      group.add(mesh);
      const wire=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:0x38bdf8,wireframe:true,transparent:true,opacity:.22}));
      wire.scale.setScalar(1.18); group.add(wire);
      group.position.set((Math.random()-.5)*25,(Math.random()-.5)*18,-3-Math.random()*18);
      group.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);
      scene.add(group); shapes.push({group,mesh,phase:Math.random()*6,speed:.08+Math.random()*.15});
    }
    const count=680, positions=new Float32Array(count*3), phases=new Float32Array(count);
    for(let i=0;i<count;i++){positions[i*3]=(Math.random()-.5)*34;positions[i*3+1]=(Math.random()-.5)*24;positions[i*3+2]=-Math.random()*30;phases[i]=Math.random()*Math.PI*2}
    const pgeo=new THREE.BufferGeometry();pgeo.setAttribute('position',new THREE.BufferAttribute(positions,3));
    const points=new THREE.Points(pgeo,new THREE.PointsMaterial({color:0x38bdf8,size:.035,transparent:true,opacity:.65,sizeAttenuation:true}));scene.add(points);
    let tx=0,ty=0,mx=0,my=0, idleUntil=Date.now()+30000, lastActivity=Date.now();
    const activity=()=>{lastActivity=Date.now();idleUntil=lastActivity+30000};
    window.addEventListener('mousemove',e=>{tx=(e.clientX/window.innerWidth-.5)*1.5;ty=(e.clientY/window.innerHeight-.5)*-1;activity()},{passive:true});
    window.addEventListener('touchstart',activity,{passive:true});
    window.addEventListener('pointerdown',activity,{passive:true});
    function animate(now){
      requestAnimationFrame(animate);
      const t=now*.001; mx+=(tx-mx)*.025; my+=(ty-my)*.025;
      camera.position.x=mx*1.8; camera.position.y=my*1.4; camera.lookAt(0,0,-5);
      shapes.forEach((s)=>{s.group.rotation.x+=s.speed*.006;s.group.rotation.y+=s.speed*.009;s.group.position.y+=Math.sin(t*.35+s.phase)*.0009;s.mesh.material.emissiveIntensity=.7+(.5+.5*Math.sin(t*.8+s.phase))*1.5;s.group.position.x+=Math.sin(t*.12+s.phase)*.0005});
      key.intensity=1.5+Math.sin(t*.65)*.55;
      points.rotation.y=Math.sin(t*.08)*.04;points.rotation.x=Math.cos(t*.1)*.025;
      const idleMode=Date.now()>idleUntil;
      const arr=pgeo.attributes.position.array;
      for(let i=0;i<count;i++){
        const idx=i*3;
        arr[idx+1]+=.002*Math.sin(t+phases[i]);
        if(arr[idx+1]>12)arr[idx+1]=-12;
        if(idleMode){arr[idx]*=.9993;arr[idx+1]*=.9993;arr[idx+2]+=(-10-arr[idx+2])*.0002}
        else {arr[idx]+=.0007*Math.sin(t*.4+phases[i]);}
      }
      pgeo.attributes.position.needsUpdate=true;
      renderer.render(scene,camera);
    }
    requestAnimationFrame(animate);
    window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.7))});
  })();

  (() => {

    function pickWeightedItem(pool) {
      const weights = pool.map((item, idx) => {
        const baseW = RARITY_CONFIG[item.rarity]?.weight || 10;
        const subFactor = 1 / (1 + (idx % 12) * 0.08);
        return baseW * subFactor * (item.value < 500 ? 2.8 : item.value < 2000 ? 1.25 : 0.42);
      });
      const total = weights.reduce((a, b) => a + b, 0);
      let r = Math.random() * total;
      for (let i = 0; i < pool.length; i++) {
        r -= weights[i];
        if (r <= 0) return pool[i];
      }
      return pool[pool.length - 1];
    }

    function sound(type='click') {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        const ac = window.__brainrotAudio || (window.__brainrotAudio = new AC());
        if (ac.state === 'suspended') ac.resume();
        const now = ac.currentTime;

        if (type === 'tick') {
          const osc = ac.createOscillator(), gain = ac.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(520 + Math.random() * 140, now);
          osc.frequency.exponentialRampToValueAtTime(160, now + 0.025);
          gain.gain.setValueAtTime(0.05, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.028);
          osc.connect(gain); gain.connect(ac.destination);
          osc.start(now); osc.stop(now + 0.03);
          return;
        }

        const frequencies = { click:[440,.045], win:[660,.28], lose:[135,.25], open:[520,.11] };
        const [f, d] = frequencies[type] || frequencies.click;
        const osc = ac.createOscillator(), gain = ac.createGain();
        osc.type = type === 'lose' ? 'sawtooth' : 'sine';
        osc.frequency.setValueAtTime(f, now);
        if (type === 'win') {
          osc.frequency.exponentialRampToValueAtTime(990, now + d * 0.5);
          osc.frequency.exponentialRampToValueAtTime(1320, now + d);
        }
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(type === 'click' ? 0.035 : 0.09, now + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + d);
        osc.connect(gain); gain.connect(ac.destination);
        osc.start(now); osc.stop(now + d + 0.02);
      } catch(e) {}
    }

        <div className="relative z-10">
          <h3 className="font-orbitron font-bold text-xs sm:text-sm truncate">{item.name}</h3>
          <p className="text-[10px] text-zinc-400 mt-0.5 truncate">{item.desc}</p>
          <div className="flex items-center justify-between mt-3 pt-2 border-t border-white/5 gap-1">
            <span className={`font-chakra text-base sm:text-lg font-bold ${affordable?'text-sky-300 neon-text':'text-zinc-500'}`}>{item.price===0?'FREE':money(item.price)+' ◈'}</span>
            <span className={`text-[9px] font-orbitron ${affordable?'text-blue-300':'text-rose-400/80'}`}>{affordable?'ОТКРЫТЬ ↗':'МАЛО ◈'}</span>
          </div>
        </div>
      </button>
    }

    // ============================================================================
    // МОДАЛКА ОТКРЫТИЯ КЕЙСА С АНИМАЦИЕЙ ПРОКРУТКИ РУЛЕТКИ
    // ============================================================================
    function CaseOpenModal({caseItem, onClose}) {
      const {balance, setBalance, addItem, user} = useGame();
      const [cooldownNow, setCooldownNow] = useState(Date.now());
      useEffect(() => { const t = setInterval(() => setCooldownNow(Date.now()), 1000); return () => clearInterval(t); }, []);
      const freeUntil = Number(localStorage.getItem(freeCooldownKey(user.id)) || 0);
      const freeRemaining = caseItem.id === 'free' ? Math.max(0, freeUntil - cooldownNow) : 0;
      const freeBlocked = caseItem.id === 'free' && freeRemaining > 0;
      const [phase, setPhase] = useState('idle');
      const [reel, setReel] = useState([]);
      const [offset, setOffset] = useState(0);
      const [transitionCss, setTransitionCss] = useState('none');
      const [wonItem, setWonItem] = useState(null);
      const [didNotPay, setDidNotPay] = useState(false);
      const [fastMode, setFastMode] = useState(false);

      const viewportRef = useRef(null);
      const timersRef = useRef([]);

      const WIN_INDEX = 42;
      const TOTAL_CARDS = 54;
      const CARD_WIDTH = 124;
      const CARD_GAP = 10;
      const STEP = CARD_WIDTH + CARD_GAP;

      useEffect(() => {
        return () => timersRef.current.forEach(t => clearTimeout(t));
      }, []);

      useEffect(() => {
        const preview = Array.from({length: 15}, (_, i) => caseItem.pool[i % caseItem.pool.length]);
        setReel(preview);
        setOffset(0);
        setTransitionCss('none');
        setPhase('idle');
        setWonItem(null);
        setDidNotPay(false);
      }, [caseItem]);

      function startSpin() {
        if (phase === 'spinning') return;
        if (balance < caseItem.price || freeBlocked) {
          sound('lose');
          return;
        }
        if (caseItem.id === 'free') localStorage.setItem(freeCooldownKey(user.id), String(Date.now() + FREE_CASE_COOLDOWN));
        supabase.rpc('record_case_open').then(({error})=>{if(error)console.warn('Leaderboard counter update failed:',error)});

        timersRef.current.forEach(t => clearTimeout(t));
        timersRef.current = [];

        setBalance(b => b - caseItem.price);
        sound('open');
        buzz(25);

        const loseRoll = caseItem.price > 0 && Math.random() < 0.72;
        const belowCostPool = caseItem.price > 0
          ? caseItem.pool.filter(item => item.value < caseItem.price)
          : [];
        const winner = loseRoll
          ? pickWeightedItem(belowCostPool.length ? belowCostPool : [...caseItem.pool].sort((a, b) => a.value - b.value).slice(0, Math.max(1, Math.ceil(caseItem.pool.length * 0.25))))
          : pickWeightedItem(caseItem.pool);
        const generatedReel = Array.from({length: TOTAL_CARDS}, (_, idx) => {
          if (idx === WIN_INDEX) return winner;
          return pickWeightedItem(caseItem.pool);
        });

        setWonItem(winner);
        setDidNotPay(loseRoll);
        setReel(generatedReel);
        setPhase('spinning');
        setTransitionCss('none');
        setOffset(0);

        const duration = fastMode ? 1200 : 4800;

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            const vw = viewportRef.current ? viewportRef.current.clientWidth : 340;
            const jitter = (Math.random() - 0.5) * (CARD_WIDTH * 0.55);
            const targetOffset = (WIN_INDEX * STEP) + (CARD_WIDTH / 2) - (vw / 2) + jitter;

            setTransitionCss(`transform ${duration}ms cubic-bezier(0.10, 0.85, 0.15, 1)`);
            setOffset(targetOffset);

            const ticksCount = fastMode ? 10 : 32;
            for (let i = 1; i <= ticksCount; i++) {
              const progress = i / ticksCount;
              const tickDelay = Math.pow(progress, 2.15) * (duration - 150);
              const tId = setTimeout(() => {
                sound('tick');
                if (i % 4 === 0) buzz(8);
              }, tickDelay);
              timersRef.current.push(tId);
            }

            const endTimer = setTimeout(() => {
              addItem({ name: winner.name, emoji: winner.emoji, value: winner.value, rarity: winner.rarity });
              setWonItem(winner);
              setPhase('won');
              if (loseRoll) { sound('lose'); buzz(35); }
              else { sound('win'); buzz(60); }
            }, duration + 120);
            timersRef.current.push(endTimer);
          });
        });
      }

      const canAfford = balance >= caseItem.price;

      return (
        <div
          className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-3 sm:p-5 overflow-y-auto"
          onClick={() => { if (phase !== 'spinning') onClose(); }}
        >
          <div
            className="glass rounded-3xl p-4 sm:p-6 w-full max-w-2xl bottom-sheet border border-blue-500/40 my-auto"
            onClick={e => e.stopPropagation()}
          >
            <div className="flex items-center justify-between gap-2 pb-3 border-b border-white/10">
              <div className="flex items-center gap-3 min-w-0">
                <span className="text-3xl">{caseItem.emoji}</span>
                <div className="min-w-0">
                  <div className="flex items-center gap-2">
                    <h3 className="font-orbitron font-bold text-base sm:text-lg truncate">{caseItem.name}</h3>
                    <RarityBadge rarity={caseItem.rarity} small />
                  </div>
                  <p className="text-xs text-zinc-400 truncate">{caseItem.desc}</p><p className="text-[9px] text-rose-300 mt-1">Шанс проигрыша: {caseItem.price===0?'58%':'72%'}</p>
                </div>
              </div>
              <button
                disabled={phase === 'spinning'}
                onClick={onClose}
                className="w-9 h-9 rounded-xl border border-white/10 bg-white/5 text-zinc-400 hover:text-white grid place-items-center text-xl disabled:opacity-30"
              >
                ×
              </button>
            </div>

            <div className="mt-5 relative">
              <div className="absolute top-0 bottom-0 left-1/2 -translate-x-1/2 w-[3px] bg-neon z-20 pointer-events-none shadow-[0_0_12px_#38BDF8]"></div>
              <div className="absolute -top-2 left-1/2 -translate-x-1/2 z-20 pointer-events-none text-sky-300 text-sm drop-shadow-[0_0_8px_#38BDF8]">▼</div>
              <div className="absolute -bottom-2 left-1/2 -translate-x-1/2 z-20 pointer-events-none text-sky-300 text-sm drop-shadow-[0_0_8px_#38BDF8]">▲</div>

              <div
                ref={viewportRef}
                className="roulette-mask overflow-hidden rounded-2xl bg-black/80 border border-blue-500/30 py-4 relative"
              >
                <div
                  className="flex items-center"
                  style={{
                    gap: `${CARD_GAP}px`,
                    transform: `translate3d(-${offset}px, 0, 0)`,
                    transition: transitionCss,
                    willChange: 'transform'
                  }}
                >
                  {reel.map((bItem, idx) => {
                    const cfg = RARITY_CONFIG[bItem.rarity] || RARITY_CONFIG.COMMON;
                    const isWinnerCard = phase === 'won' && idx === WIN_INDEX;
                    return (
                      <div
                        key={idx}
                        style={{
                          width: `${CARD_WIDTH}px`,
                          minWidth: `${CARD_WIDTH}px`,
                          borderColor: isWinnerCard ? '#38BDF8' : cfg.border,
                          background: `linear-gradient(165deg, ${cfg.bg}, rgba(5,5,5,0.92))`
                        }}
                        className={`rounded-2xl p-2.5 text-center border transition-transform ${isWinnerCard ? 'scale-105 shadow-neon' : ''}`}
                      >
                        <div className="text-[8px] font-orbitron tracking-wider truncate" style={{color: cfg.color}}>
                          {cfg.dot} {cfg.label}
                        </div>
                        <div className="text-4xl my-2 select-none drop-shadow">{bItem.emoji}</div>
                        <div className="font-orbitron font-bold text-[10px] text-white truncate px-1">{bItem.name}</div>
                        <div className="font-chakra text-xs text-sky-300 mt-0.5">{money(bItem.value)} ◈</div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>

            {phase === 'won' ? (wonItem ? (
              <div className="mt-5 p-4 rounded-2xl border border-neon/60 bg-blue-950/25 text-center win-pop">
                <div className={`section-kicker ${didNotPay ? 'text-rose-300' : 'text-sky-300'}`}>{didNotPay ? 'НЕ ОКУПИЛОСЬ — НО ДРОП ТВОЙ!' : 'НОВЫЙ БРЕЙНРОТ ПОЛУЧЕН!'}</div>
                <div className="text-5xl my-2">{wonItem.emoji}</div>
                <div className="font-orbitron font-black text-lg text-white">{wonItem.name}</div>
                <div className="mt-1 flex items-center justify-center gap-2">
                  <RarityBadge rarity={wonItem.rarity} />
                  <span className="font-chakra font-bold text-sky-300 text-base">{money(wonItem.value)} ◈</span>
                </div>
                <p className="text-[11px] text-zinc-400 mt-2">{didNotPay ? `Дроп дешевле кейса (${money(caseItem.price)} ◈). Предмет всё равно добавлен в инвентарь.` : 'Предмет уже добавлен в твой инвентарь!'}</p>
                <div className="flex flex-wrap gap-2 mt-4">
                  <ActionButton variant="ghost" className="flex-1" onClick={onClose}>В ИНВЕНТАРЬ</ActionButton>
                  <ActionButton
                    className="flex-1"
                    disabled={!canAfford || freeBlocked}
                    onClick={startSpin}
                  >
                    {freeBlocked ? `БЕСПЛАТНЫЙ КЕЙС ЧЕРЕЗ ${Math.floor(freeRemaining/60000)}:${String(Math.floor((freeRemaining%60000)/1000)).padStart(2,'0')}` : `КРУТИТЬ ЕЩЁ (${caseItem.price === 0 ? 'FREE' : money(caseItem.price) + ' ◈'})`}
                  </ActionButton>
                </div>
              </div>
            ) : (
              <div className="mt-5 p-5 rounded-2xl border border-rose-500/40 bg-rose-950/20 text-center win-pop">
                <div className="text-4xl mb-2">💥</div><div className="font-orbitron font-bold text-rose-300">НЕ ОКУПИЛОСЬ!</div>
                <p className="text-xs text-zinc-400 mt-2">В этот раз без дропа. Попробуй снова позже.</p>
                <ActionButton variant="ghost" className="w-full mt-4" onClick={onClose}>ЗАКРЫТЬ</ActionButton>
              </div>
            )) : (
              <div className="mt-5 flex flex-wrap items-center justify-between gap-3">
                <button
                  type="button"
                  disabled={phase === 'spinning'}
                  onClick={() => setFastMode(f => !f)}
                  className={`px-3 py-3 rounded-xl font-orbitron text-[10px] border transition ${fastMode ? 'border-neon bg-neon/15 text-sky-300' : 'border-white/15 bg-black/40 text-zinc-400'}`}
                >
                  ⚡ БЫСТРО: {fastMode ? 'ВКЛ' : 'ВЫКЛ'}
                </button>

                <ActionButton
                  className="flex-1 py-3.5 text-xs sm:text-sm"
                  disabled={phase === 'spinning' || !canAfford || freeBlocked}
                  onClick={startSpin}
                >
                  {phase === 'spinning'
                    ? 'ОТКРЫВАЕМ КЕЙС...'
                    : !canAfford
                    ? `НЕ ХВАТАЕТ МОНЕТ (${money(caseItem.price)} ◈)`
                    : freeBlocked ? `БЕСПЛАТНЫЙ КЕЙС ЧЕРЕЗ ${Math.floor(freeRemaining/60000)}:${String(Math.floor((freeRemaining%60000)/1000)).padStart(2,'0')}` : `ОТКРЫТЬ КЕЙС ЗА ${caseItem.price === 0 ? 'FREE' : money(caseItem.price) + ' ◈'}`}
                </ActionButton>
              </div>
            )}

            <div className="mt-6 pt-4 border-t border-white/10">
              <div className="flex items-center justify-between mb-3">
                <span className="section-kicker">СОДЕРЖИМОЕ КЕЙСА ({caseItem.pool.length} БРЕЙНРОТОВ)</span>
                <span className="text-[10px] text-zinc-500">От худших к лучшим</span>
              </div>
              <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-2 max-h-52 overflow-y-auto pr-1">
                {caseItem.pool.map(b => {
                  const cfg = RARITY_CONFIG[b.rarity] || RARITY_CONFIG.COMMON;
                  return (
                    <div
                      key={b.id}
                      className="rounded-xl p-2 text-center border bg-black/40"
                      style={{ borderColor: cfg.border }}
                    >
                      <div className="text-2xl">{b.emoji}</div>
                      <div className="font-orbitron text-[9px] truncate mt-1 text-zinc-200" title={b.name}>{b.name}</div>
                      <div className="text-[8px] font-bold mt-0.5 truncate" style={{color: cfg.color}}>{cfg.dot} {cfg.label}</div>
                      <div className="font-chakra text-[10px] text-sky-300 mt-0.5">{money(b.value)} ◈</div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function CasesTab(){
      const [openedCase, setOpenedCase] = useState(null);
      const groups = ['БЕСПЛАТНЫЕ', 'ОБЫЧНЫЕ', 'ПРЕМИУМ', 'OG & SECRET'];

      return <div className="tab-enter space-y-6">
        <div className="glass rounded-2xl p-4 sm:p-5 tiny-grid relative overflow-hidden">
          <div className="absolute -right-5 -top-8 text-8xl opacity-[.07]">◈</div>
          <div className="section-kicker">STEAL A VERT1X / DROP ZONE</div>
          <h1 className="font-orbitron text-2xl sm:text-3xl font-black mt-2 leading-tight">СОБЕРИ ВСЕХ<br/><span className="text-sky-300 neon-text">БРЕЙНРОТОВ.</span></h1>
          <p className="text-xs text-zinc-400 mt-2 max-w-[340px] leading-relaxed">Игра выводит Brainrot’ов не в оригинальном Steal a Brainrot, а в фанмейд-игре Steal a Vert1x.</p>
          <div className="flex flex-wrap gap-2 mt-4">
            <span className="border border-blue-500/25 bg-blue-500/5 rounded-lg px-2.5 py-1.5 text-[9px] text-blue-200">✦ {BRAINROTS.length} ОРИГИНАЛЬНЫХ БРЕЙНРОТОВ</span>
            <span className="border border-blue-500/25 bg-blue-500/5 rounded-lg px-2.5 py-1.5 text-[9px] text-blue-200">✦ 8 РЕДКОСТЕЙ</span>
          </div>
        </div>

        {groups.map((group, idx) => {
          const items = CASES_DATA.filter(i => i.category === group);
          return (
            <section key={group}>
              <SectionTitle eyebrow={`DROP SERIES / 0${idx + 1}`} title={group}/>
              <div className="case-grid grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">
                {items.map(item => (
                  <CaseCard key={item.id} item={item} onOpen={c => { sound('open'); setOpenedCase(c); }}/>
                ))}
              </div>
            </section>
          );
        })}

        {openedCase && (
          <CaseOpenModal
            caseItem={openedCase}
            onClose={() => setOpenedCase(null)}
          />
        )}
      </div>
    }

    // ============================================================================
    // ОБНОВЛЕННЫЙ АПГРЕЙДЕР: АНИМАЦИЯ 3.2 СЕК + ЗАПОЛНЯЮЩАЯСЯ ПОЛОСА ШАНСА ВНУТРИ КРУГА
    // ============================================================================
    function UpgradeTab(){
      const {inventory, addItem, removeItem} = useGame();
      const [selected, setSelected] = useState(null);
      const [target, setTarget] = useState(null);
      const [mult, setMult] = useState('x2');
      const [spinning, setSpinning] = useState(false);
      const [outcome, setOutcome] = useState(null);
      const [needle, setNeedle] = useState(0);
      const [flash, setFlash] = useState('');

      const multipliers = [['x2',2],['x4',4],['x8',8],['35%',.35],['55%',.55],['75%',.75]];
      const chance = (mult.endsWith('%') ? parseInt(mult)/100 : 1/parseInt(mult)) * 0.60;
      const pct = Math.round(chance * 100);
      const stake = selected?.value || 0;
      const desiredValue = Math.max(20, Math.round(stake * (1 / chance)));

      const possibleTargets = useMemo(() => {
        if (!selected) return [];
        const sorted = [...BRAINROTS].filter(b => b.value > selected.value);
        if (sorted.length === 0) return BRAINROTS.slice(-6);
        sorted.sort((a, b) => Math.abs(a.value - desiredValue) - Math.abs(b.value - desiredValue));
        return sorted.slice(0, 6).sort((a, b) => a.value - b.value);
      }, [selected, desiredValue]);

      function chooseTarget(item){ setTarget(item); setOutcome(null); }

      function runUpgrade(){
        if (spinning || !selected || !target) return;
        setSpinning(true);
        setOutcome(null);
        sound('open');
        buzz(50);

        const win = Math.random() < chance;
        const winZoneDeg = chance * 360;

        // Если выиграл — стрелка останавливается внутри сектора шанса (0..winZoneDeg)
        // Если проиграл — стрелка останавливается за его пределами (winZoneDeg..360)
        const margin = 4;
        let finalAngleMod;
        if (win) {
          finalAngleMod = margin + Math.random() * Math.max(2, winZoneDeg - margin * 2);
        } else {
          finalAngleMod = winZoneDeg + margin + Math.random() * Math.max(2, (360 - winZoneDeg) - margin * 2);
        }

        const startAngle = needle % 360;
        const spins = 6 * 360; // 6 полных оборотов для сочной 3.2-секундной прокрутки
        const totalDelta = spins + ((finalAngleMod - startAngle + 360) % 360);

        const start = performance.now();
        const duration = 3200; // ~3.2 секунды
        let lastTickAngle = startAngle;

        function tick(now){
          const p = Math.min(1, (now - start) / duration);
          // Плавное замедление (cubic-quartic ease-out)
          const ease = 1 - Math.pow(1 - p, 3.5);
          const currentAngle = startAngle + totalDelta * ease;
          setNeedle(currentAngle);

          if (currentAngle - lastTickAngle >= 38) {
            lastTickAngle = currentAngle;
            sound('tick');
          }

          if (p < 1) {
            requestAnimationFrame(tick);
          } else {
            setSpinning(false);
            setFlash(win ? 'win' : 'lose');
            setTimeout(() => setFlash(''), 850);

            if (win) {
              removeItem(selected.id);
              addItem({ name: target.name, emoji: target.emoji, value: target.value, rarity: target.rarity });
              setOutcome({ win: true, item: target });
              sound('win');
              confetti();
            } else {
              removeItem(selected.id);
              setOutcome({ win: false, item: selected });
              sound('lose');
              document.querySelector('.app-shell')?.classList.add('screen-shake');
              setTimeout(() => document.querySelector('.app-shell')?.classList.remove('screen-shake'), 400);
            }
            setSelected(null);
            setTarget(null);
          }
        }
        requestAnimationFrame(tick);
      }

      function confetti(){
        for(let i=0;i<24;i++){
          const el=document.createElement('div');
          el.textContent=['✦','◆','●','◈'][i%4];
          el.style.cssText=`position:fixed;z-index:55;left:50%;top:48%;color:${i%2?'#38bdf8':'#93C5FD'};font-size:${10+Math.random()*18}px;pointer-events:none;transition:all ${.7+Math.random()*.7}s ease-out;`;
          document.body.appendChild(el);
          requestAnimationFrame(()=>{
            el.style.transform=`translate(${(Math.random()-.5)*window.innerWidth}px,${(Math.random()-.5)*window.innerHeight}px) rotate(${Math.random()*500}deg)`;
            el.style.opacity='0';
          });
          setTimeout(()=>el.remove(),1600);
        }
      }

      // Расчёт длины дуги для заполняющейся полосы шанса внутри круга
      const radius = 98;
      const circumference = 2 * Math.PI * radius;
      const winDash = circumference * chance;

      return <div className="tab-enter space-y-5">
        <div className="flex items-end justify-between">
          <div><div className="section-kicker">RISK ENGINE / 01</div><h1 className="font-orbitron font-black text-2xl mt-1">UPGRADE<span className="text-sky-300">_</span></h1></div>
          <div className="text-right"><div className="text-[9px] text-zinc-500 tracking-widest">SUCCESS CHANCE</div><div className="font-chakra text-2xl text-sky-300 neon-text">{pct}<span className="text-sm">%</span></div></div>
        </div>
        <div className="glass rounded-3xl p-4 sm:p-5 relative overflow-hidden">
          <div className="absolute inset-0 opacity-30 tiny-grid"></div>
          <div className="relative flex flex-col items-center">
            <div className="wheel-wrap relative w-[250px] h-[250px] sm:w-[285px] sm:h-[285px]">
              <svg viewBox="0 0 280 280" className="w-full h-full">
                <defs>
                  <linearGradient id="wheelGrad" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stopColor="#38bdf8"/>
                    <stop offset="52%" stopColor="#3b82f6"/>
                    <stop offset="100%" stopColor="#071426"/>
                  </linearGradient>
                  <linearGradient id="chanceBarGrad" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stopColor="#7DD3FC"/>
                    <stop offset="50%" stopColor="#38BDF8"/>
                    <stop offset="100%" stopColor="#2563EB"/>
                  </linearGradient>
                  <filter id="glow">
                    <feGaussianBlur stdDeviation="3" result="blur"/>
                    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                  </filter>
                </defs>

                {/* Внешний корпус колеса (неподвижный) */}
                <circle cx="140" cy="140" r="128" fill="#050914" stroke="#1E3A8A" strokeWidth="2"/>
                <circle cx="140" cy="140" r="118" fill="none" stroke="url(#wheelGrad)" strokeWidth="2.5" filter="url(#glow)"/>

                {/* Деления циферблата */}
                {Array.from({length:36},(_,i)=><line key={i} x1="140" y1="22" x2="140" y2={i%3===0?32:27} stroke={i%3===0?'#38bdf8':'#1E3A8A'} strokeWidth={i%3===0?2:1} transform={`rotate(${i*10} 140 140)`}/>)}

                {/* Фоновая дорожка полосы шанса внутри круга */}
                <circle
                  cx="140"
                  cy="140"
                  r={radius}
                  fill="none"
                  stroke="rgba(15, 23, 42, 0.9)"
                  strokeWidth="16"
                />
                <circle
                  cx="140"
                  cy="140"
                  r={radius}
                  fill="none"
                  stroke="rgba(244, 63, 94, 0.16)"
                  strokeWidth="14"
                  strokeDasharray="4 6"
                />

                {/* ДИНАМИЧЕСКАЯ ЗАПОЛНЯЮЩАЯСЯ ПОЛОСА ШАНСА ВНУТРИ КРУГА */}

          else{

      const [reason,setReason]=useState('');
      const [message,setMessage]=useState('');
      const [busy,setBusy]=useState(false);

      async function act(){
        setBusy(true);
        setMessage('');
        try {
          if (kind === 'verify' || kind === 'unverify') {
            const isVerifying = kind === 'verify';
            const cleanTarget = target.trim();
            if (!cleanTarget) throw new Error('Укажи игровой ID (например VX-...)');

            const {data, error} = await supabase.rpc('admin_set_verified', {
              p_user_id: cleanTarget,
              p_verified: isVerifying
            });

            if (error) {
              const {error: updError} = await supabase
                .from('profiles')
                .update({ verified: isVerifying })
                .eq('user_id', cleanTarget);
              if (updError) throw error;
            }

            if (cleanTarget === user.id) {
              updateUser({ verified: isVerifying });
            }

            setMessage(data ? `Готово: ${data}` : (isVerifying ? `Галочка (Verified) выдана игроку ${cleanTarget}` : `Галочка снята у игрока ${cleanTarget}`));
            setBusy(false);
            return;
          }

          let rpc, args;
          if(kind==='promo'){
            rpc='admin_create_promo';
            args={p_code:code.trim().toUpperCase(),p_coins:Number(coins),p_max_uses:Number(uses)};
          } else if(kind==='grant'){
            rpc='admin_grant_coins';
            args={p_user_id:target.trim(),p_coins:Number(coins),p_reason:reason||'Admin grant'};
          } else if(kind==='ban'){
            rpc='admin_set_ban';
            args={p_user_id:target.trim(),p_banned:true,p_reason:reason||'Нарушение правил'};
          } else if(kind==='unban'){
            rpc='admin_set_ban';
            args={p_user_id:target.trim(),p_banned:false,p_reason:reason||'Разблокировка'};
          } else {
            rpc='admin_set_role';
            args={p_user_id:target.trim(),p_role:targetRole};
          }
          const {data,error}=await supabase.rpc(rpc,args);
          if(error)throw error;
          setMessage('Готово: '+(typeof data==='string'?data:JSON.stringify(data)));
        } catch(e) {
          setMessage('Ошибка: '+(e.message||'действие отклонено'));
        } finally {
          setBusy(false);
        }
      }

      return <div className="tab-enter space-y-4">
        <SectionTitle eyebrow={`SECURE CONSOLE · ${role.toUpperCase()}`} title="АДМИН-ПАНЕЛЬ"/>
        <div className="glass rounded-2xl p-4">
          <p className="text-xs text-amber-200 mb-3">Все действия проверяются базой данных. Не выдавайте никому пароль владельца или ключ service_role.</p>
          <label className="text-[10px] text-zinc-500">ДЕЙСТВИЕ</label>
          <select value={kind} onChange={e=>setKind(e.target.value)} className="w-full mt-1 mb-4 bg-black border border-blue-900 rounded-xl p-3 text-sm">
            <option value="promo">Создать промокод</option>
            <option value="grant">Выдать монеты</option>
            <option value="verify">✓ Выдать галочку (Verified)</option>
            <option value="unverify">✕ Снять галочку (Verified)</option>
            <option value="ban">Заблокировать игрока</option>
            <option value="unban">Разблокировать игрока</option>
            <option value="role">Назначить / снять младшую админку</option>
          </select>

          {kind==='promo' ? (
            <>
              <label className="text-[10px] text-zinc-500">КОД (латиница/цифры)</label>
              <input value={code} onChange={e=>setCode(e.target.value.toUpperCase())} placeholder="VERT1X500" className="w-full mt-1 mb-3 bg-black border border-blue-900 rounded-xl p-3 text-sm"/>
              <label className="text-[10px] text-zinc-500">МОНЕТ ЗА АКТИВАЦИЮ</label>
              <input type="number" min="1" value={coins} onChange={e=>setCoins(e.target.value)} className="w-full mt-1 mb-3 bg-black border border-blue-900 rounded-xl p-3 text-sm"/>
              <label className="text-[10px] text-zinc-500">МАКСИМУМ АКТИВАЦИЙ НА ВСЕХ ИГРОКОВ</label>
              <input type="number" min="1" value={uses} onChange={e=>setUses(e.target.value)} className="w-full mt-1 bg-black border border-blue-900 rounded-xl p-3 text-sm"/>
            </>
          ) : (
            <>
              <div className="flex items-center justify-between">
                <label className="text-[10px] text-zinc-500">ID ИГРОКА (например VX-...)</label>
                <button type="button" onClick={()=>setTarget(user.id)} className="text-[10px] text-sky-400 hover:underline">Подставить мой ID ({user.id})</button>
              </div>
              <input value={target} onChange={e=>setTarget(e.target.value)} placeholder="VX-..." className="w-full mt-1 mb-3 bg-black border border-blue-900 rounded-xl p-3 text-sm"/>
              {kind==='grant' && (
                <>
                  <label className="text-[10px] text-zinc-500">КОЛИЧЕСТВО МОНЕТ</label>
                  <input type="number" min="1" value={coins} onChange={e=>setCoins(e.target.value)} className="w-full mt-1 mb-3 bg-black border border-blue-900 rounded-xl p-3 text-sm"/>
                </>
              )}
              {kind==='role' && (
                <>
                  <label className="text-[10px] text-zinc-500">РОЛЬ</label>
                  <select value={targetRole} onChange={e=>setTargetRole(e.target.value)} className="w-full mt-1 mb-3 bg-black border border-blue-900 rounded-xl p-3 text-sm">
                    <option value="player">Снять админку</option>
                    <option value="moderator">Младший администратор</option>
                  </select>
                </>
              )}
              {(kind==='verify' || kind==='unverify') && (
                <div className="mb-3 p-3 rounded-xl border border-sky-500/30 bg-sky-500/10 flex items-center gap-2.5 text-xs text-sky-200">
                  <VerifiedBadge className="w-5 h-5" />
                  <span>{kind==='verify' ? 'Игрок получит неоновую галочку рядом с ником в профиле, шапке и топе.' : 'Галочка верификации будет убрана с профиля игрока.'}</span>
                </div>
              )}
              <label className="text-[10px] text-zinc-500">ПРИЧИНА / КОММЕНТАРИЙ</label>
              <input value={reason} onChange={e=>setReason(e.target.value)} placeholder="Причина действия" className="w-full mt-1 bg-black border border-blue-900 rounded-xl p-3 text-sm"/>
            </>
          )}
          <ActionButton className="w-full mt-4 py-4" disabled={busy} onClick={act}>{busy?'ВЫПОЛНЯЕТСЯ...':'ВЫПОЛНИТЬ ДЕЙСТВИЕ'}</ActionButton>
          {message&&<p className="text-xs text-sky-200 mt-3 break-words">{message}</p>}
        </div>
        <p className="text-[10px] text-zinc-600">Роль владельца закреплена за игровым ID VX-72FE8C3E54. Младшие администраторы не могут менять роли и банить/разбанивать других администраторов.</p>
      </div>
    }

    const SESSION_KEY = 'vertix_drop_session_v1';

    async function loadCloudAccount(authUser) {
      if (!authUser) return null;
      let { data: profile, error: profileError } = await supabase
        .from('profiles').select('*').eq('id', authUser.id).maybeSingle();
      if (profileError) throw profileError;
      if (!profile) {
        const username = authUser.user_metadata?.username || authUser.email?.split('@')[0] || 'Player';
        const created = await supabase.from('profiles').insert({id:authUser.id, username}).select('*').single();
        if (created.error) throw created.error;
        profile = created.data;
      }
      let { data: save, error: saveError } = await supabase
        .from('player_saves').select('balance,inventory').eq('user_id', authUser.id).maybeSingle();
      if (saveError) throw saveError;
      if (!save) {
        const initial = {user_id:authUser.id, balance:1500, inventory:initialInventory};
        const createdSave = await supabase.from('player_saves').insert(initial).select('balance,inventory').single();
        if (createdSave.error) throw createdSave.error;
        save = createdSave.data;
      }
      const {data:access,error:accessError}=await supabase.rpc('get_my_access');
      if(accessError) throw accessError;
      if(access?.banned){await supabase.auth.signOut();throw new Error('Аккаунт заблокирован. Обратитесь к администрации.');}
      return {
        role: access?.role || 'player',
        authUserId: authUser.id,
        user: {
          name: profile.username || 'Player',
          email: authUser.email || '',
          id: profile.user_id,
          verified: Boolean(profile.verified),
          avatar: (profile.avatar_url && !/^https?:\/\//i.test(profile.avatar_url) ? profile.avatar_url : '🐊'),
          avatarUrl: (/^https?:\/\//i.test(profile.avatar_url || '') ? profile.avatar_url : null)
        },
        balance: Number(save.balance ?? 1500),
        inventory: Array.isArray(save.inventory) ? save.inventory : initialInventory
      };
    }

    function AuthGate({onAuth}){
      const [mode,setMode]=useState('register'); const [email,setEmail]=useState(''); const [name,setName]=useState(''); const [password,setPassword]=useState(''); const [error,setError]=useState(''); const [busy,setBusy]=useState(false); const [message,setMessage]=useState('');
      async function submit(e){
        e.preventDefault(); setError(''); setMessage(''); setBusy(true);
        const mail=email.trim().toLowerCase();
        if(!mail||!password){setError('Заполни почту и пароль.');setBusy(false);return;}
        if(password.length<6){setError('Пароль должен быть не короче 6 символов.');setBusy(false);return;}
        try {
          if(mode==='register') {
            const {data,error:authError}=await supabase.auth.signUp({email:mail,password,options:{data:{username:name.trim()||mail.split('@')[0]}}});
            if(authError) throw authError;
            if(!data.session) { setMessage('Аккаунт создан. Проверь почту и подтверди адрес, затем войди.'); setMode('login'); setBusy(false); return; }
            const acc=await loadCloudAccount(data.user); onAuth(acc);
          } else {
            const {data,error:authError}=await supabase.auth.signInWithPassword({email:mail,password});
            if(authError) throw authError;
            const acc=await loadCloudAccount(data.user); onAuth(acc);
          }
        } catch(err) { setError(err?.message || 'Не удалось выполнить вход. Проверь настройки Supabase.'); }
        finally { setBusy(false); }
      }
      return <div className="fixed inset-0 z-[100] bg-black/90 backdrop-blur-xl grid place-items-center p-4"><form onSubmit={submit} className="glass rounded-3xl p-6 w-full max-w-md"><div className="text-center mb-5"><div className="mx-auto mb-3 grid place-items-center w-14 h-14 rounded-2xl bg-blue-500/15 border border-sky-400/40 text-3xl">◈</div><div className="section-kicker">VERT1X DROP ACCOUNT</div><h1 className="font-orbitron font-black text-xl mt-2">{mode==='register'?'СОЗДАТЬ АККАУНТ':'ВХОД В АККАУНТ'}</h1><p className="text-xs text-zinc-500 mt-2">Аккаунт и уникальный User ID сохраняются в облаке</p></div>
        {mode==='register'&&<input value={name} onChange={e=>setName(e.target.value)} placeholder="Имя игрока" maxLength="24" className="w-full mb-3 rounded-xl bg-black/50 border border-blue-900 p-3 text-sm outline-none focus:border-sky-400"/>}
        <input type="email" required value={email} onChange={e=>setEmail(e.target.value)} placeholder="Электронная почта" autoComplete="email" className="w-full mb-3 rounded-xl bg-black/50 border border-blue-900 p-3 text-sm outline-none focus:border-sky-400"/>
        <input type="password" required minLength="6" value={password} onChange={e=>setPassword(e.target.value)} placeholder="Пароль (минимум 6 символов)" autoComplete={mode==='register'?'new-password':'current-password'} className="w-full rounded-xl bg-black/50 border border-blue-900 p-3 text-sm outline-none focus:border-sky-400"/>
        {error&&<p className="text-rose-300 text-xs mt-3">{error}</p>}{message&&<p className="text-sky-300 text-xs mt-3">{message}</p>}
        <button disabled={busy} type="submit" className="btn w-full mt-4 rounded-xl p-3 bg-gradient-to-r from-blue-500 to-sky-300 text-black font-orbitron font-bold text-xs">{busy?'ПОДОЖДИ...':mode==='register'?'ЗАРЕГИСТРИРОВАТЬСЯ':'ВОЙТИ'}</button>
        <button type="button" disabled={busy} onClick={()=>{setMode(mode==='register'?'login':'register');setError('');setMessage('')}} className="w-full mt-4 text-xs text-sky-300">{mode==='register'?'Уже есть аккаунт? Войти':'Нет аккаунта? Зарегистрироваться'}</button>
        <p className="text-[10px] leading-relaxed text-zinc-600 text-center mt-4">Пароли обрабатывает Supabase Auth. Для регистрации может потребоваться подтверждение почты.</p>
      </form></div>
    }

    function App(){
      const [active,setActive]=useState('cases');
      const [account,setAccount]=useState(null);
      const [balance,setBalance]=useState(1500);
      const [inventory,setInventory]=useState(initialInventory);
      const [deposit,setDeposit]=useState(false);
      const [user,setUser]=useState({name:'',id:'',avatar:'🐊',verified:false});
      const [avatarData,setAvatarData]=useState(null);
      const [role,setRole]=useState('player');
      const [authLoading,setAuthLoading]=useState(true);
      const [toast,setToast]=useState('');
      const nextId=useRef(500);
      const saveTimer=useRef(null);

      const addItem=item=>setInventory(prev=>[{...item,id:nextId.current++},...prev]);
      function handleAuth(acc){setAccount(acc);setUser(acc.user);setBalance(acc.balance??1500);setInventory(acc.inventory??initialInventory);setAvatarData(null);setRole(acc.role||'player');}
      async function logout(){await supabase.auth.signOut();setAccount(null);setUser({name:'',id:'',avatar:'🐊',verified:false});setBalance(1500);setInventory(initialInventory);setActive('cases');}
      function updateUser(patch){setUser(prev=>({...prev,...patch}));}
      useEffect(()=>{
        let alive=true;
        (async()=>{
          try { const {data,error}=await supabase.auth.getSession(); if(error) throw error;
            if(data.session?.user){const acc=await loadCloudAccount(data.session.user);if(alive)handleAuth(acc);}
          } catch(err){console.error('Supabase session/profile load:',err);if(alive)setToast('Не удалось загрузить профиль: '+(err?.message||'ошибка'));}
          finally {if(alive)setAuthLoading(false);}
        })();
        const {data:{subscription}}=supabase.auth.onAuthStateChange((event,session)=>{
          if(event==='SIGNED_OUT'&&alive){setAccount(null);setUser({name:'',id:'',avatar:'🐊',verified:false});}
        });
        return()=>{alive=false;subscription.unsubscribe();};
      },[]);
      useEffect(()=>{
        if(!account?.authUserId)return;
        if(saveTimer.current)clearTimeout(saveTimer.current);
        saveTimer.current=setTimeout(async()=>{
          const {error}=await supabase.from('player_saves').upsert({user_id:account.authUserId,balance,inventory,updated_at:new Date().toISOString()},{onConflict:'user_id'});
          if(error)console.error('Cloud save failed:',error);
        },500);
        return()=>{if(saveTimer.current)clearTimeout(saveTimer.current);};
      },[account?.authUserId,balance,inventory]);
      useEffect(()=>{
        if(!account?.authUserId)return;
        const patch={username:user.name||'Player',avatar_url:user.avatarUrl||user.avatar||null};
        supabase.from('profiles').update(patch).eq('id',account.authUserId).then(({error})=>{if(error)console.error('Profile save failed:',error);});
      },[account?.authUserId,user.name,user.avatarUrl,user.avatar]);
      const removeItem=id=>setInventory(prev=>prev.filter(i=>i.id!==id));

      useEffect(()=>{
        const konami=['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];let seq=[];
        const key=e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();seq.push(e.key.length===1?e.key.toLowerCase():e.key);seq=seq.slice(-10);if(seq.join('|')===konami.join('|')){window.dispatchEvent(new CustomEvent('matrix-mode',{detail:!document.body.classList.contains('matrix')}));seq=[];setToast(document.body.classList.contains('matrix')?'MATRIX MODE OFF':'MATRIX MODE // ENABLED');setTimeout(()=>setToast(''),2200);sound('open')}};
        const runner=()=>{const el=document.createElement('div');el.className='runner';el.textContent='🚽';document.body.appendChild(el);setTimeout(()=>el.remove(),3300)};
        const promo=()=>{setBalance(b=>b+250);setToast('SECRET DROP FOUND · +250 ◈');sound('win');setTimeout(()=>setToast(''),2600)};
        const redeemed=()=>{setToast('PROMO APPLIED · +500 ◈');setTimeout(()=>setToast(''),2000)};
        window.addEventListener('keydown',key);window.addEventListener('brainrot-runner',runner);window.addEventListener('secret-promo',promo);window.addEventListener('promo-redeemed',redeemed);
        return()=>{window.removeEventListener('keydown',key);window.removeEventListener('brainrot-runner',runner);window.removeEventListener('secret-promo',promo);window.removeEventListener('promo-redeemed',redeemed)};
      },[]);

      useEffect(()=>{const wallet=()=>setDeposit(true);const admin=()=>setActive('admin');const refresh=async()=>{if(!account?.authUserId)return;const {data}=await supabase.from('player_saves').select('balance,inventory').eq('user_id',account.authUserId).maybeSingle();if(data){setBalance(Number(data.balance||0));setInventory(Array.isArray(data.inventory)?data.inventory:[]);}};window.addEventListener('open-wallet',wallet);window.addEventListener('open-admin',admin);window.addEventListener('cloud-refresh-balance',refresh);return()=>{window.removeEventListener('open-wallet',wallet);window.removeEventListener('open-admin',admin);window.removeEventListener('cloud-refresh-balance',refresh)}},[account?.authUserId]);
      const value={balance,setBalance,inventory,setInventory,addItem,removeItem,user,updateUser,logout,role,account};
      if(authLoading) return <div className="fixed inset-0 bg-black grid place-items-center text-sky-300 font-orbitron text-xs">VERT1X DROP · ПОДКЛЮЧЕНИЕ К БАЗЕ...</div>;
      if(!account) return <AuthGate onAuth={handleAuth}/>;
      return <GameContext.Provider value={value}><div className="app-shell min-h-screen">
        <Header onDeposit={()=>setDeposit(true)}/>
        <main className="main-content px-4 pt-2 pb-32">
          <div className="flex items-center gap-2 mb-5 text-[9px] tracking-[.17em] text-zinc-500 font-chakra"><span className="w-1.5 h-1.5 rounded-full bg-neon shadow-neon"></span> STEAL A VERT1X ENGINE <span className="text-zinc-800">/</span> BUILD 2.0 <span className="ml-auto">89 BRAINROTS LOADED</span></div>
          {active==='cases'&&<CasesTab/>}{active==='upgrade'&&<UpgradeTab/>}{active==='profile'&&<ProfileTab/>}{active==='leaderboard'&&<LeaderboardsTab/>}{active==='admin'&&role!=='player'&&<AdminPanel/>}
          <FooterDisclaimer />
        </main>
        <BottomNav active={active} setActive={setActive} isAdmin={role!=='player'}/>
        {deposit&&<Deposit onClose={()=>setDeposit(false)}/>}
        {toast&&<div className="fixed top-24 left-1/2 -translate-x-1/2 z-[70] glass rounded-xl px-4 py-3 text-center text-[10px] font-orbitron text-sky-300 whitespace-nowrap">{toast}</div>}
      </div></GameContext.Provider>
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
