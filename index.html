/* SAKURA atmospheric motion + owner certification */
body::after{
  content:"";position:fixed;inset:-18%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(34rem 30rem at 14% 22%,rgba(255,62,138,.14),transparent 70%),
    radial-gradient(28rem 26rem at 82% 34%,rgba(255,91,173,.105),transparent 72%),
    radial-gradient(32rem 28rem at 56% 88%,rgba(255,91,132,.10),transparent 72%);
  filter:blur(22px);opacity:.8;transform:translate3d(0,0,0);
  animation:sakuraAurora 19s ease-in-out infinite alternate;
}
@keyframes sakuraAurora{
  0%{transform:translate3d(-2%,1%,0) scale(.96) rotate(-2deg);opacity:.62}
  50%{transform:translate3d(2%,-1%,0) scale(1.04) rotate(2deg);opacity:.92}
  100%{transform:translate3d(-1%,-2%,0) scale(1.08) rotate(-1deg);opacity:.72}
}
.glass{position:relative;isolation:isolate}
.glass::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0;
  background:linear-gradient(115deg,transparent 15%,rgba(255,255,255,.08) 36%,rgba(255,160,202,.12) 48%,transparent 68%);
  background-size:220% 100%;opacity:.5;animation:glassSheen 11s ease-in-out infinite;
}
.glass>*{position:relative;z-index:1}
@keyframes glassSheen{0%,100%{background-position:130% 0;opacity:.18}50%{background-position:-30% 0;opacity:.52}}
.btn.bg-gradient-to-r{animation:buttonAura 4.8s ease-in-out infinite}
@keyframes buttonAura{
  0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 5px 16px rgba(220,55,122,.18)}
  50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.42),0 7px 24px rgba(255,70,147,.32),0 0 16px rgba(255,85,159,.10)}
}
.card{border-color:rgba(255,255,255,.12)}
.card:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 18px 44px rgba(40,0,15,.34),0 0 26px color-mix(in srgb,var(--c,#ff76ae) 24%,transparent)}
.kick{color:rgba(255,170,205,.78)}
.owner-cert{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;
  padding:9px 13px;border:1px solid rgba(255,130,184,.32);border-radius:999px;
  background:linear-gradient(135deg,rgba(255,80,150,.13),rgba(255,255,255,.045));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 0 24px rgba(255,70,144,.10);
  color:var(--fg);letter-spacing:.07em;font-size:9px;font-weight:800;
}
.owner-cert .cert-check{
  display:grid;place-items:center;width:20px;height:20px;border-radius:50%;
  color:#ffeaf3;background:linear-gradient(135deg,#ff8dbf,#db4480);
  box-shadow:0 0 15px rgba(255,90,160,.4);font-size:12px;letter-spacing:0;
}
.owner-cert .cert-owner{color:#ffa9cf;letter-spacing:.04em;font-size:10px}

/* Cosmic animated background: stars, nebulae and occasional comets */
html{background:#13050a}
body{position:relative;isolation:isolate;background:transparent!important}
body::before{
  content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(1px 1px at 7% 13%,rgba(255,255,255,.95) 98%,transparent),
    radial-gradient(1.5px 1.5px at 18% 72%,rgba(255,190,218,.9) 98%,transparent),
    radial-gradient(1px 1px at 29% 31%,rgba(255,255,255,.85) 98%,transparent),
    radial-gradient(1.5px 1.5px at 42% 84%,rgba(255,170,205,.8) 98%,transparent),
    radial-gradient(1px 1px at 56% 18%,rgba(255,255,255,.9) 98%,transparent),
    radial-gradient(1.5px 1.5px at 67% 57%,rgba(255,200,222,.8) 98%,transparent),
    radial-gradient(1px 1px at 79% 23%,rgba(255,255,255,.95) 98%,transparent),
    radial-gradient(1px 1px at 91% 78%,rgba(255,190,218,.85) 98%,transparent),
    radial-gradient(2px 2px at 87% 8%,rgba(255,255,255,.7) 98%,transparent),
    radial-gradient(1px 1px at 12% 92%,rgba(255,255,255,.8) 98%,transparent),
    radial-gradient(ellipse at 18% 20%,rgba(150,37,80,.18),transparent 42%),
    radial-gradient(ellipse at 83% 68%,rgba(82,40,140,.16),transparent 43%),
    linear-gradient(180deg,#13050a 0%,#200811 52%,#13050a 100%);
  background-size: 100% 100%;
  animation: cosmicDrift 48s ease-in-out infinite alternate;
}
body::after{
  content:"";position:fixed;top:-22%;left:-38%;width:36vw;height:2px;min-width:220px;
  z-index:-1;pointer-events:none;opacity:0;
  background:linear-gradient(90deg,transparent,rgba(255,160,202,.05),rgba(255,205,227,.95),rgba(255,120,177,.42),transparent);
  box-shadow:0 0 8px rgba(255,140,190,.55),0 0 24px rgba(255,100,163,.3);
  transform:rotate(-27deg);transform-origin:center;
  animation:cosmicComet 13s linear infinite;
}
@keyframes cosmicDrift{
  0%{transform:scale(1);filter:brightness(.86)}
  50%{filter:brightness(1.08)}
  100%{transform:scale(1.035);filter:brightness(.96)}
}
@keyframes cosmicComet{
  0%,70%{left:-40%;top:-20%;opacity:0}
  72%{opacity:.9}
  88%{left:115%;top:95%;opacity:.75}
  90%,100%{left:120%;top:100%;opacity:0}
}
:root[data-theme="light"] body::before{
  opacity:.35;filter:invert(.75) hue-rotate(170deg) brightness(1.5)
}
:root[data-theme="light"] body::after{opacity:.4}
@media(prefers-reduced-motion:reduce){
  body::before,body::after{animation:none!important}
}

    {err?<p className="glass p-4 rounded-xl text-xs text-rose-300">Не удалось загрузить рейтинг.</p>:<div className="glass rounded-2xl p-3 space-y-2">{rows.length?rows.map((r,i)=><button type="button" key={r.user_id||i} onClick={()=>setSelected({username:r.username||'Player',user_id:r.user_id,score:r.score||0,verified:!!(r.verified||ver[r.user_id])})} className="leader-row w-full text-left flex items-center gap-3 p-3 rounded-xl bg-white/[.03]"><span className="font-orbitron text-sm text-pink-300 w-8">#{i+1}</span><span className="flex-1 truncate text-sm flex items-center gap-1.5">{r.username||'Player'}{(r.verified||ver[r.user_id])&&<Verified/>}</span><b className="font-chakra text-pink-200">{money(r.score||0)}</b><span className="text-zinc-500">›</span></button>):<p className="text-center text-xs text-zinc-500 p-6">Рейтинг пуст</p>}</div>}
    {selected&&<div className="fixed inset-0 z-50 bg-black/65 flex items-end sm:items-center justify-center p-3" onClick={()=>setSelected(null)}><div className="glass rounded-3xl p-5 w-full max-w-md" onClick={e=>e.stopPropagation()}><div className="flex justify-between items-start"><div><div className="kick">PLAYER CARD</div><h2 className="mt-1">ПРОФИЛЬ ИГРОКА</h2></div><button onClick={()=>setSelected(null)} className="text-2xl text-zinc-500">×</button></div><div className="flex items-center gap-3 mt-5"><div className="w-14 h-14 rounded-2xl glass grid place-items-center text-2xl">🐊</div><div><div className="font-bold text-lg break-words">{selected.username} {selected.verified&&<Verified/>}</div><div className="text-xs text-zinc-500 break-all">ID: {selected.user_id||'—'}</div></div></div><div className="glass rounded-xl p-3 mt-4"><div className="kick">ПОКАЗАТЕЛЬ РЕЙТИНГА</div><b className="text-xl">{money(selected.score)}</b></div><p className="text-xs text-zinc-500 mt-3">Баланс и инвентарь других игроков не показываются в публичном профиле.</p></div></div>}
  </div>;
}

function Admin(){
  const {role,user,updateUser}=useG();
  const [kind,setKind]=useState('promo'),[code,setCode]=useState(''),[coins,setCoins]=useState('500'),[uses,setUses]=useState('1'),[target,setTarget]=useState(''),[tr,setTr]=useState('moderator'),[reason,setReason]=useState(''),[msg,setMsg]=useState(''),[busy,setBusy]=useState(false);
  const inp="w-full mt-1 mb-3 bg-black border border-pink-900 rounded-xl p-3 text-sm";
  async function act(){
    setBusy(true);setMsg('');
    try{
      const t=target.trim();let rpc,args;
      if(kind==='verify'||kind==='unverify'){
        if(!t)throw new Error('Укажи игровой ID');
        const v=kind==='verify';
        const {error}=await supabase.rpc('admin_set_verified',{p_user_id:t,p_verified:v});
        if(error){const {error:e2}=await supabase.from('profiles').update({verified:v}).eq('user_id',t);if(e2)throw error}
        if(t===user.id)updateUser({verified:v});
        setMsg(v?`Галочка выдана: ${t}`:`Галочка снята: ${t}`);return;
      }
      if(kind==='promo'){rpc='admin_create_promo';args={p_code:code.trim().toUpperCase(),p_coins:Number(coins),p_max_uses:Number(uses)}}
      else if(kind==='grant'){rpc='admin_grant_coins';args={p_user_id:t,p_coins:Number(coins),p_reason:reason||'Admin grant'}}
      else if(kind==='deduct'){if(!t)throw new Error('Укажи игровой ID');const amount=Number(coins);if(!Number.isFinite(amount)||amount<=0)throw new Error('Укажи количество монет больше нуля');rpc='admin_deduct_coins';args={p_user_id:t,p_coins:amount,p_reason:reason||'Admin deduction'}}
      else if(kind==='ban'||kind==='unban'){rpc='admin_set_ban';args={p_user_id:t,p_banned:kind==='ban',p_reason:reason||'—'}}
      else{rpc='admin_set_role';args={p_user_id:t,p_role:tr}}
      const {data,error}=await supabase.rpc(rpc,args);if(error)throw error;
      setMsg('Готово: '+(typeof data==='string'?data:JSON.stringify(data)));
    }catch(e){setMsg('Ошибка: '+(e.message||'отклонено'))}finally{setBusy(false)}
  }
  return <div className="tab space-y-4"><Title k={`CONSOLE · ${role.toUpperCase()}`} t="АДМИН-ПАНЕЛЬ"/>
    <div className="glass rounded-2xl p-4"><p className="text-xs text-amber-200 mb-3">Все действия проверяются базой. Никому не передавай ключ service_role.</p>
      <select value={kind} onChange={e=>setKind(e.target.value)} className={inp}><option value="promo">Создать промокод</option><option value="grant">Выдать монеты</option><option value="deduct">➖ Вычесть монеты</option><option value="verify">✓ Выдать галочку</option><option value="unverify">✕ Снять галочку</option><option value="ban">Заблокировать</option><option value="unban">Разблокировать</option><option value="role">Роль</option></select>
      {kind==='promo'?<><input value={code} onChange={e=>setCode(e.target.value.toUpperCase())} placeholder="КОД" className={inp}/><input type="number" min="1" value={coins} onChange={e=>setCoins(e.target.value)} className={inp}/><input type="number" min="1" value={uses} onChange={e=>setUses(e.target.value)} className={inp}/></>
      :<><div className="flex justify-end"><button type="button" onClick={()=>setTarget(user.id)} className="text-[10px] text-pink-400">Мой ID ({user.id})</button></div><input value={target} onChange={e=>setTarget(e.target.value)} placeholder="VX-..." className={inp}/>
        {(kind==='grant'||kind==='deduct')&&<><input type="number" min="1" value={coins} onChange={e=>setCoins(e.target.value)} placeholder="Количество монет" className={inp}/>{kind==='deduct'&&<p className="text-xs text-amber-200 mb-3">Монеты списываются через защищённую функцию Supabase.</p>}</>}
        {kind==='role'&&<select value={tr} onChange={e=>setTr(e.target.value)} className={inp}><option value="player">Снять админку</option><option value="moderator">Младший админ</option></select>}
        <input value={reason} onChange={e=>setReason(e.target.value)} placeholder="Причина" className={inp}/></>}
      <Btn className="w-full mt-2 py-4" disabled={busy} onClick={act}>{busy?'ВЫПОЛНЯЕТСЯ...':'ВЫПОЛНИТЬ'}</Btn>
      {msg&&<p className="text-xs text-pink-200 mt-3 break-words">{msg}</p>}</div></div>;
}

async function loadAccount(au){
  if(!au)return null;
  let {data:p,error:pe}=await supabase.from('profiles').select('*').eq('id',au.id).maybeSingle();if(pe)throw pe;
  if(!p){const c=await supabase.from('profiles').insert({id:au.id,username:au.user_metadata?.username||au.email?.split('@')[0]||'Player'}).select('*').single();if(c.error)throw c.error;p=c.data}
  let {data:s,error:se}=await supabase.from('player_saves').select('balance,inventory').eq('user_id',au.id).maybeSingle();if(se)throw se;
  if(!s){const c=await supabase.from('player_saves').insert({user_id:au.id,balance:1500,inventory:INIT}).select('balance,inventory').single();if(c.error)throw c.error;s=c.data}
  const {data:acc,error:ae}=await supabase.rpc('get_my_access');if(ae)throw ae;
  if(acc?.banned){await supabase.auth.signOut();throw new Error('Аккаунт заблокирован.')}
  // чиним дубли ID у старых сохранений
  const seen=new Set(),inv=(Array.isArray(s.inventory)?s.inventory:INIT).map(i=>{let id=i.id;if(id==null||seen.has(id)||typeof id==='number')id=uid();seen.add(id);return{...i,id}});
  return{role:acc?.role||'player',authUserId:au.id,balance:Number(s.balance??1500),inventory:inv,
    user:{name:p.username||'Player',id:p.user_id,verified:!!p.verified,avatar:p.avatar_url&&!/^https?:/i.test(p.avatar_url)?p.avatar_url:'🐊'}};
}

function Auth({onAuth}){
  const [mode,setMode]=useState('register'),[email,setEmail]=useState(''),[name,setName]=useState(''),[pw,setPw]=useState(''),[err,setErr]=useState(''),[msg,setMsg]=useState(''),[busy,setBusy]=useState(false);
  async function submit(e){
    e.preventDefault();setErr('');setMsg('');setBusy(true);
    const mail=email.trim().toLowerCase();
    try{
      if(!mail||pw.length<6)throw new Error('Введи почту и пароль от 6 символов.');
      if(mode==='register'){
        const {data,error}=await supabase.auth.signUp({email:mail,password:pw,options:{data:{username:name.trim()||mail.split('@')[0]}}});if(error)throw error;
        if(!data.session){setMsg('Аккаунт создан. Подтверди почту и войди.');setMode('login');return}
        onAuth(await loadAccount(data.user));
      }else{const {data,error}=await supabase.auth.signInWithPassword({email:mail,password:pw});if(error)throw error;onAuth(await loadAccount(data.user))}
    }catch(x){setErr(x?.message||'Ошибка входа')}finally{setBusy(false)}
  }
  const inp="w-full mb-3 rounded-xl bg-black/50 border border-pink-900 p-3 text-sm outline-none focus:border-pink-400";
  return <div className="fixed inset-0 z-[100] bg-black/90 grid place-items-center p-4"><form onSubmit={submit} className="glass pop rounded-3xl p-6 w-full max-w-md">
    <div className="text-center mb-5"><div className="mx-auto mb-3 grid place-items-center w-14 h-14 rounded-2xl bg-pink-500/15 border border-pink-400/40 text-3xl">◈</div><div className="kick">SAKURA DROP</div><h1 className="font-orbitron font-black text-xl mt-2">{mode==='register'?'СОЗДАТЬ АККАУНТ':'ВХОД'}</h1></div>
    {mode==='register'&&<input value={name} onChange={e=>setName(e.target.value)} placeholder="Имя игрока" maxLength="24" className={inp}/>}
    <input type="email" required value={email} onChange={e=>setEmail(e.target.value)} placeholder="Почта" autoComplete="email" className={inp}/>
    <input type="password" required minLength="6" value={pw} onChange={e=>setPw(e.target.value)} placeholder="Пароль (от 6 символов)" autoComplete={mode==='register'?'new-password':'current-password'} className={inp}/>
    {err&&<p className="text-rose-300 text-xs">{err}</p>}{msg&&<p className="text-pink-300 text-xs">{msg}</p>}
    <button disabled={busy} type="submit" className="btn w-full mt-4 rounded-xl p-3 bg-gradient-to-r from-pink-500 to-pink-300 text-black font-orbitron font-bold text-xs">{busy?'ПОДОЖДИ...':mode==='register'?'ЗАРЕГИСТРИРОВАТЬСЯ':'ВОЙТИ'}</button>
    <button type="button" disabled={busy} onClick={()=>{setMode(mode==='register'?'login':'register');setErr('');setMsg('')}} className="w-full mt-4 text-xs text-pink-300">{mode==='register'?'Уже есть аккаунт? Войти':'Нет аккаунта? Регистрация'}</button>
  </form></div>;
}

function App(){
  const [active,setActive]=useState('cases'),[account,setAccount]=useState(null),[balance,setBalance]=useState(1500),[inventory,setInventory]=useState(INIT),[deposit,setDeposit]=useState(false),[settings,setSettings]=useState(false),[user,setUser]=useState({name:'',id:'',avatar:'🐊',verified:false}),[role,setRole]=useState('player'),[loading,setLoading]=useState(true),[toast,setToast]=useState('');
  const saveT=useRef(null);
  const addItem=item=>setInventory(p=>[{...item,id:uid()},...p]);
  const removeItem=id=>setInventory(p=>p.filter(i=>i.id!==id));
  const updateUser=patch=>setUser(p=>({...p,...patch}));
  function handleAuth(a){setAccount(a);setUser(a.user);setBalance(a.balance);setInventory(a.inventory);setRole(a.role)}
  async function logout(){await supabase.auth.signOut();setAccount(null);setUser({name:'',id:'',avatar:'🐊',verified:false});setBalance(1500);setInventory(INIT);setActive('cases')}
  useEffect(()=>{
    let alive=true;
    (async()=>{try{const {data,error}=await supabase.auth.getSession();if(error)throw error;if(data.session?.user){const a=await loadAccount(data.session.user);if(alive)handleAuth(a)}}
      catch(e){console.error(e);if(alive){setToast('Не удалось загрузить профиль: '+(e?.message||'ошибка'));setTimeout(()=>setToast(''),4000)}}
      finally{if(alive)setLoading(false)}})();
    const {data:{subscription}}=supabase.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&alive)setAccount(null)});
    return()=>{alive=false;subscription.unsubscribe()};
  },[]);
  useEffect(()=>{
    if(!account?.authUserId)return;
    clearTimeout(saveT.current);
    saveT.current=setTimeout(async()=>{const {error}=await supabase.from('player_saves').upsert({user_id:account.authUserId,balance,inventory,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)console.error('Save failed',error)},500);
    return()=>clearTimeout(saveT.current);
  },[account?.authUserId,balance,inventory]);
  useEffect(()=>{
    if(!account?.authUserId)return;
    supabase.from('profiles').update({username:user.name||'Player',avatar_url:user.avatar||null}).eq('id',account.authUserId).then(({error})=>{if(error)console.error(error)});
  },[account?.authUserId,user.name,user.avatar]);
  useEffect(()=>{
    const w=()=>setDeposit(true),a=()=>setActive('admin');
    const r=async()=>{if(!account?.authUserId)return;const {data}=await supabase.from('player_saves').select('balance,inventory').eq('user_id',account.authUserId).maybeSingle();if(data){setBalance(Number(data.balance||0));setInventory(Array.isArray(data.inventory)?data.inventory:[])}};
    window.addEventListener('open-wallet',w);window.addEventListener('open-admin',a);window.addEventListener('cloud-refresh-balance',r);
    return()=>{window.removeEventListener('open-wallet',w);window.removeEventListener('open-admin',a);window.removeEventListener('cloud-refresh-balance',r)};
  },[account?.authUserId]);
  if(loading)return <div className="fixed inset-0 bg-black grid place-items-center text-pink-300 font-orbitron text-xs">SAKURA DROP · ПОДКЛЮЧЕНИЕ...</div>;
  if(!account)return <Auth onAuth={handleAuth}/>;
  const nav=[['cases','▦','КЕЙСЫ'],['upgrade','⌁','АПГРЕЙД'],['leaderboard','♛','ТОП'],['profile','◉','ПРОФИЛЬ'],...(role!=='player'?[['admin','⚙','АДМИН']]:[])];
  return <G.Provider value={{balance,setBalance,inventory,setInventory,addItem,removeItem,user,updateUser,logout,role,account}}>
    <Header onDeposit={()=>setDeposit(true)} onSettings={()=>setSettings(true)}/>
    <main className="max-w-[1060px] mx-auto px-4 pt-2 pb-32">
      <div className="flex items-center gap-2 mb-5 text-[9px] tracking-[.17em] text-zinc-500 font-chakra"><span className="w-1.5 h-1.5 rounded-full bg-pink-400"/> SAKURA ENGINE <span className="ml-auto">{BR.length} BRAINROTS LOADED</span></div>
      {active==='cases'&&<CasesTab/>}{active==='upgrade'&&<UpgradeTab/>}{active==='profile'&&<ProfileTab/>}{active==='leaderboard'&&<Leaderboard/>}{active==='admin'&&role!=='player'&&<Admin/>}
      <footer className="mt-10 rounded-2xl border border-white/10 bg-black/30 px-4 py-4 text-center text-[11px] text-zinc-400">
        <div className="mb-3"><span className="owner-cert"><span className="cert-check">✓</span><span>СЕРТИФИЦИРОВАНО ВЛАДЕЛЬЦЕМ</span><span className="cert-owner">Steal a Sakura</span></span></div>
        Неофициальный фанатский проект, не связан с Roblox. Предметы и монеты виртуальные.
        <div className="mt-3 flex flex-wrap justify-center gap-x-4 gap-y-2"><a className="text-pink-400" href="https://t.me/RobloxOwners" target="_blank" rel="noopener noreferrer">Разработчик @RobloxOwners</a><a className="text-pink-400" href="https://t.me/1mprtxx" target="_blank" rel="noopener noreferrer">Владелец @1mprtxx</a><a className="text-pink-400" href="https://t.me/BrainrotDropAPK" target="_blank" rel="noopener noreferrer">ТГК @BrainrotDropAPK</a></div>
      </footer>
    </main>
    <nav className="fixed bottom-0 left-0 right-0 z-30 px-4 pt-2 max-w-[540px] mx-auto" style={{paddingBottom:'max(10px,env(safe-area-inset-bottom))'}}>
      <div className={`glass rounded-2xl p-2 grid gap-2 ${nav.length===5?'grid-cols-5':'grid-cols-4'}`}>{nav.map(([id,ic,l])=><button key={id} onClick={()=>{buzz(10);snd('click');setActive(id)}} className={`nav rounded-xl py-2.5 flex flex-col items-center gap-1 ${active===id?'on':'text-zinc-500'}`}><span className="text-xl leading-5">{ic}</span><span className="font-orbitron text-[9px] tracking-[.1em]">{l}</span></button>)}</div></nav>
    {deposit&&<Deposit onClose={()=>setDeposit(false)}/>}{settings&&<Settings onClose={()=>setSettings(false)}/>}
    {toast&&<div className="fixed top-24 left-1/2 -translate-x-1/2 z-[70] glass rounded-xl px-4 py-3 text-[10px] font-orbitron text-pink-300">{toast}</div>}
  </G.Provider>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
